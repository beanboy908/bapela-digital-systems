<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e5ed8">
  <title>You're offline | Bapela Digital</title>
  <style>
    :root { --brand: #1e5ed8; --ink: #202124; --sub: #606671; --bg: #f0f4ff; }
    * { box-sizing: border-box; }
    body { align-items: center; background: linear-gradient(135deg, #f7f4ee 0%, #f1f5ff 55%, #e3edff 100%); color: var(--ink); display: grid; font-family: Arial, sans-serif; margin: 0; min-height: 100vh; padding: 1.5rem; }
    main { background: #ffffff; border: 1px solid #dfe4ed; border-radius: 24px; box-shadow: 0 18px 42px rgba(32, 33, 36, 0.1); margin: auto; max-width: 520px; padding: 2.5rem; text-align: center; }
    img { height: 76px; margin-bottom: 1.4rem; width: 76px; }
    h1 { font-size: clamp(1.8rem, 7vw, 2.5rem); line-height: 1.15; margin: 0 0 1rem; }
    p { color: var(--sub); line-height: 1.7; margin: 0 auto 1.5rem; max-width: 390px; }
    button { background: var(--brand); border: 0; border-radius: 999px; color: #ffffff; cursor: pointer; font-size: 1rem; font-weight: 700; padding: 0.9rem 1.35rem; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/bapela-search-icon-192.png" alt="Bapela Digital logo">
    <h1>You're offline.</h1>
    <p>Check your connection, then try again. Bapela Digital will be ready when you are.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
